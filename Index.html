<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon E-Commerce CFA</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f5f6fa; color: #333; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        header { background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; }
        .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 22px; font-weight: bold; color: #2c3e50; text-decoration: none; }
        .nav-controls { display: flex; gap: 15px; align-items: center; }
        .cart-status { font-weight: bold; color: #e74c3c; cursor: pointer; background: #fdedec; padding: 8px 15px; border-radius: 20px; }
        .btn-admin-toggle { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        /* DESIGN POPUPS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .modal-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 500px; position: relative; }
        .modal-container h2 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #4b5563; }
        .form-group input { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        
        /* BOUTON GÉOLOCALISATION CLIENT */
        .btn-gps { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #map { width: 100%; height: 250px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; z-index: 5; }
        
        .btn-submit { width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .modal-link { text-align: center; margin-top: 15px; font-size: 14px; color: #3498db; cursor: pointer; display: block; }
        
        /* ESPACE ADMIN & PRODUITS */
        #admin-panel { background: #ebf3f9; border-radius: 8px; border: 2px dashed #3498db; padding: 20px; margin-bottom: 30px; display: none; }
        .admin-form { display: flex; flex-wrap: wrap; gap: 10px; }
        .admin-form input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 180px; }
        .admin-form button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        .product-image { width: 100%; height: 220px; object-fit: cover; }
        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-price { font-size: 20px; font-weight: bold; color: #e74c3c; margin: 10px 0 15px 0; }
        .btn-add { background: #34495e; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: rgba(231, 76, 60, 0.9); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; display: none; z-index: 10; }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="#" class="logo">🛍️ Boutique CFA</a>
            <div class="nav-controls">
                <button class="btn-admin-toggle" onclick="ouvrirEspaceProprietaire()">Connexion Propriétaire</button>
                <div class="cart-status" onclick="ouvrirPanierOuCommande()">🛒 Panier (<span id="cart-count">0</span>)</div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="admin-panel">
            <h3>🛠️ Espace Propriétaire : Gestion du catalogue</h3>
            <div class="admin-form">
                <input type="text" id="new-title" placeholder="Nom du produit" required>
                <input type="number" id="new-price" placeholder="Prix (en F CFA)" required>
                <input type="text" id="new-img" placeholder="Lien URL de la photo" required>
                <button onclick="ajouterProduitManuel()">Ajouter le produit</button>
            </div>
        </section>
        <section class="products-grid" id="products-container"></section>
    </main>

    <div id="modal-inscription" class="modal-overlay">
        <div class="modal-container">
            <h2>Créer un compte Client</h2>
            <form id="inscriptionForm" onsubmit="validerInscription(event)">
                <div class="form-group"><label>Adresse Email</label><input type="email" required id="client-email"></div>
                <div class="form-group"><label>Mot de passe</label><input type="password" required id="client-code"></div>
                <button type="submit" class="btn-submit">S'inscrire et continuer</button>
                <span class="modal-link" onclick="basculerModal('inscription', 'connexion')">Déjà inscrit ? Connectez-vous</span>
            </form>
        </div>
    </div>

    <div id="modal-connexion" class="modal-overlay">
        <div class="modal-container">
            <h2>Connexion Client</h2>
            <form id="connexionForm" onsubmit="validerConnexionClient(event)">
                <div class="form-group"><label>Adresse Email</label><input type="email" required id="login-email"></div>
                <div class="form-group"><label>Mot de passe</label><input type="password" required id="login-code"></div>
                <button type="submit" class="btn-submit">Se connecter</button>
                <span class="modal-link" onclick="basculerModal('connexion', 'inscription')">Pas encore de compte ? Inscrivez-vous</span>
            </form>
        </div>
    </div>

    <div id="modal-finalisation" class="modal-overlay">
        <div class="modal-container">
            <h2>Détails de livraison</h2>
            <form id="finalisationForm" onsubmit="ValiderCommandeFin(event)">
                <div class="form-group"><label>Numéro de téléphone</label><input type="tel" required id="client-tel" placeholder="Ex: +223..."></div>
                <div class="form-group">
                    <label>Votre adresse de livraison</label>
                    <button type="button" class="btn-gps" onclick="trouverMaPosition()">🎯 Retrouver ma position sur la carte</button>
                    <input type="text" id="client-coords" readonly placeholder="Ou cliquez manuellement sur la carte..." required>
                    <div id="map"></div>
                </div>
                <button type="submit" class="btn-submit">Confirmer ma commande</button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURATION FIREBASE SÉCURISÉE
        const firebaseConfig = {
          apiKey: "AIzaSyCPFqvs5iD0h4diR_mcwFdi79M-QUlsPo0",
          authDomain: "ma-boutique-653ef.firebaseapp.com",
          projectId: "ma-boutique-653ef",
          storageBucket: "ma-boutique-653ef.firebasestorage.app",
          messagingSenderId: "784091520206",
          appId: "1:784091520206:web:879c42926f968decddc49f"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let map, marker, clientConnecte = false, estProprietaire = false, panier = [];
        let catalogue = [
            { id: 1, titre: "Montre Luxe", prix: 65000, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=500" },
            { id: 2, titre: "Casque Audio Pro", prix: 85000, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=500" }
        ];

        function initMap() {
            if (map) return; 
            map = L.map('map').setView([12.6392, -8.0029], 12); // Centré par défaut sur Bamako
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            map.on('click', function(e) {
                placerMarqueur(e.latlng.lat, e.latlng.lng);
            });
        }

        function placerMarqueur(lat, lng) {
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            document.getElementById("client-coords").value = "Lat: " + lat.toFixed(5) + ", Lng: " + lng.toFixed(5);
        }

        // FONCTION MAGIQUE DE GÉOLOCALISATION DIRECTE
        function trouverMaPosition() {
            if (!navigator.geolocation) {
                return alert("La géolocalisation n'est pas supportée par votre navigateur.");
            }
            
            alert("Recherche de votre position en cours... Veuillez autoriser l'accès si demandé.");
            
            navigator.geolocation.getCurrentPosition(function(position) {
                const maLat = position.coords.latitude;
                const maLng = position.coords.longitude;
                
                // On déplace la carte sur sa vraie position et on zoome fort (16)
                map.setView([maLat, maLng], 16);
                placerMarqueur(maLat, maLng);
                
            }, function() {
                alert("Impossible de récupérer votre position. Vérifiez que votre GPS est activé.");
            }, {
                enableHighAccuracy: true, // Force l'utilisation du GPS précis du téléphone
                timeout: 10000
            });
        }

        function basculerModal(fermer, ouvrir) {
            document.getElementById(`modal-${fermer}`).style.display = "none";
            document.getElementById(`modal-${ouvrir}`).style.display = "flex";
            if(ouvrir === 'finalisation') { setTimeout(initMap, 300); }
        }

        function afficherProduits() {
            const container = document.getElementById("products-container");
            container.innerHTML = "";
            catalogue.forEach(prod => {
                container.innerHTML += `
                    <div class="product-card">
                        <button class="btn-delete" style="display: ${estProprietaire ? 'block' : 'none'}" onclick="retirerProduit(${prod.id})">❌ Supprimer</button>
                        <img src="${prod.img}" class="product-image">
                        <div class="product-info">
                            <h3>${prod.titre}</h3>
                            <p class="product-price">${prod.prix.toLocaleString('fr-FR')} F CFA</p>
                            <button class="btn-add" onclick="ajouterAuPanier('${prod.titre.replace(/'/g, "\\'")}', ${prod.prix})">Ajouter au panier</button>
                        </div>
                    </div>`;
            });
        }

        function validerInscription(event) {
            event.preventDefault();
            auth.createUserWithEmailAndPassword(document.getElementById("client-email").value, document.getElementById("client-code").value)
                .then(() => { clientConnecte = true; basculerModal('inscription', 'finalisation'); })
                .catch((e) => alert(e.message));
        }

        function validerConnexionClient(event) {
            event.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById("login-email").value, document.getElementById("login-code").value)
                .then(() => { clientConnecte = true; basculerModal('connexion', 'finalisation'); })
                .catch((e) => alert(e.message));
        }

        function ValiderCommandeFin(event) {
            event.preventDefault();
            const tel = document.getElementById("client-tel").value;
            const coords = document.getElementById("client-coords").value;
            const totalCommande = panier.reduce((s, i) => s + i.prix, 0).toLocaleString('fr-FR') + " F CFA";
            const listeArticles = panier.map(item => item.nom).join(", ");

            const chiffresPurs = coords.replace("Lat: ", "").replace(" Lng: ", "");
            const lienItineraire = "http://maps.google.com/maps?daddr=" + chiffresPurs;

            fetch("https://formspree.io/f/mkoejwed", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "Téléphone du client": tel,
                    "Articles commandés": listeArticles,
                    "Montant Total": totalCommande,
                    "Lien Itinéraire Livraison": lienItineraire
                })
            })
            .then(response => {
                if (response.ok) {
                    alert("Commande réussie ! Le vendeur a reçu vos coordonnées.");
                    panier = []; document.getElementById("cart-count").innerText = "0";
                    document.getElementById("modal-finalisation").style.display = "none";
                } else {
                    alert("Erreur lors de la validation de la commande.");
                }
            })
            .catch(error => {
                alert("Erreur réseau ou connexion impossible.");
            });
        }

        function ajouterAuPanier(nom, prix) { panier.push({ nom, prix }); document.getElementById("cart-count").innerText = panier.length; }
        
        function ouvrirPanierOuCommande() {
            if (panier.length === 0) return alert("Votre panier est vide.");
            if (!clientConnecte) document.getElementById("modal-inscription").style.display = "flex";
            else { 
                document.getElementById("modal-finalisation").style.display = "flex";
                setTimeout(initMap, 300);
            }
        }
        
        function ouvrirEspaceProprietaire() {
            if (prompt("Mot de passe :") === "admin123") { estProprietaire = true; document.getElementById("admin-panel").style.display = "block"; afficherProduits(); }
        }
        function ajouterProduitManuel() {
            const t = document.getElementById("new-title").value, p = parseFloat(document.getElementById("new-price").value), i = document.getElementById("new-img").value;
            if (t && !isNaN(p) && i) { catalogue.push({ id: Date.now(), titre: t, prix: p, img: i }); afficherProduits(); }
        }
        function retirerProduit(id) { catalogue = catalogue.filter(p => p.id !== id); afficherProduits(); }
        window.onload = afficherProduits;
    </script>
</body>
</html>
